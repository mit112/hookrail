name: Bug report
description: Something in Hookrail isn't behaving as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security vulnerabilities**, please don't file
        a public issue — see [SECURITY.md](https://github.com/mit112/hookrail/blob/main/.github/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
      placeholder: Deliveries to a healthy endpoint stayed in `retry_scheduled` even though the endpoint returned 200…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smaller and more deterministic, the better. A curl sequence or a failing test is ideal.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: how-run
    attributes:
      label: How are you running Hookrail?
      options:
        - quickstart.yml (published images)
        - docker-compose.yml (full stack)
        - k3s deploy
        - prebuilt binaries
        - built from source
        - other (describe below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag, image tag, or `git rev-parse --short HEAD`.
      placeholder: v0.1.0 / ghcr.io ...:latest / a163500
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste any error output. This is automatically formatted as code.
      render: shell
