name: release-go
# Go service release: prebuilt binaries + a draft GitHub Release (GoReleaser) and
# :latest / :vX.Y.Z multi-arch images on GHCR. Cutting the tag is attended — Mit
# pushes `vX.Y.Z` and publishes the drafted release. `python-v*` tags are handled
# by release.yml, not this workflow.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}   # manual dry-run: GoReleaser --snapshot, no publish, no push

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push images to GHCR

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # tag push -> real release (draft); manual run -> snapshot only, never published
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist
          path: dist/*.tar.gz

  images:
    if: startsWith(github.ref, 'refs/tags/')   # only tag pushes publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push service image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Build & push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-dashboard:latest
            ghcr.io/${{ github.repository }}-dashboard:${{ github.ref_name }}
