name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: golangci/golangci-lint-action@v7
        with: { version: "v2.12.2" }
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go vet ./...
      - run: go test ./... -race -count=1
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: bash scripts/docs-verify.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: clients/web/package-lock.json }
      - run: npm ci
        working-directory: clients/web
      - run: npm run typecheck && npm run lint && npm run test && npm run build
        working-directory: clients/web
  integration:
    runs-on: ubuntu-latest # docker available → testcontainers works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go test -tags integration ./... -race -count=1
  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: ./scripts/e2e.sh
  k8s-smoke:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install k3d
        run: curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
      - uses: azure/setup-kubectl@v4
        with: { version: "v1.33.1" }
      - name: Preflight (fail early if a tool is missing)
        run: command -v k3d kubectl docker jq
      - name: Ephemeral k3d e2e
        run: bash scripts/k8s-e2e.sh
  image:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          sbom: true
          provenance: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          target: dashboard
          tags: |
            ghcr.io/${{ github.repository }}-dashboard:main
            ghcr.io/${{ github.repository }}-dashboard:sha-${{ github.sha }}
          sbom: true
          provenance: false
  dash-verify:
    runs-on: ubuntu-latest # python-only; verifies dashboards map to declared+emitted metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make dash-verify
  chaos:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest # docker available → compose chaos stacks run
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Chaos subset (E1 worker-crash + E2 postgres-outage + E3 queue-loss + E5 ordered-no-reorder + E6 leader-failover + E_RL limiter fail-open; no netem)
        env:
          HOOKRAIL_MASTER_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
        run: go test -tags chaos ./test/chaos -v -count=1 -timeout 40m -run 'TestExperimentWorkerCrash|TestExperimentPostgresOutage|TestExperimentRedisQueueLoss|TestExperimentOrderedNoReorder|TestExperimentLeaderFailover|TestChaos_E_RL_LimiterFailOpenAndRecover'
  pg-failover:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest # docker + k3d → CNPG cluster; host go test drives the oracle
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Install k3d
        run: curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
      - uses: azure/setup-kubectl@v4
        with: { version: "v1.33.1" }
      - name: Preflight (fail early if a tool is missing)
        run: command -v k3d kubectl docker go
      - name: CNPG Postgres-failover chaos (kill primary; RPO=0 + liveness + dup bound)
        run: bash scripts/pg-failover-e2e.sh
