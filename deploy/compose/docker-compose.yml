name: hookrail
# Fixed subnet so HOOKRAIL_ALLOW_CIDRS can name it precisely: in-network
# delivery (test-receiver) resolves to this range, which the default SSRF
# policy would correctly block as private — §8 allowlist mode covers it.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookrail
      POSTGRES_USER: hookrail
      POSTGRES_PASSWORD: hookrail
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrail"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]  # AOF reduces the loss gap (§10)
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  migrate: # one-shot migration job: every service waits for it, none race it
    build: ../..
    command: ["hookrail-ctl", "migrate"]
    restart: "no"
    environment: &hookrail-env
      DATABASE_URL: postgres://hookrail:hookrail@postgres:5432/hookrail?sslmode=disable
      REDIS_ADDR: redis:6379
      HOOKRAIL_MASTER_KEY: ${HOOKRAIL_MASTER_KEY}
      HOOKRAIL_ALLOW_HTTP: "true"            # compose-only: receiver is plain http (§8 dev mode)
      HOOKRAIL_ALLOW_CIDRS: "172.28.0.0/16"  # compose-only: in-network delivery (§8 allowlist mode)
      # Pass-through (empty default = use the binary's built-in default) so the
      # integration harness can flip the global limiter off and shorten the
      # per-endpoint refresh interval without editing this file.
      HOOKRAIL_GLOBAL_RATELIMIT: ${HOOKRAIL_GLOBAL_RATELIMIT:-}
      HOOKRAIL_LIMITS_REFRESH_INTERVAL: ${HOOKRAIL_LIMITS_REFRESH_INTERVAL:-}
      HOOKRAIL_RL_REDIS_ADDR: ${HOOKRAIL_RL_REDIS_ADDR:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres: { condition: service_healthy }

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0"]
    ports: ["8474:8474"]
    depends_on:
      redis: { condition: service_healthy }

  dashboard-provisioner:
    build: ../..
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh","-c"]
    command:
      # NOTE: $$ escapes a literal $ so docker compose does not interpolate
      # these shell variables at config-parse time.
      - |
        set -eu
        pk=$$(hookrail-ctl create-producer-key -name dashboard -scope '*' | awk -F= '/^producer_key=/{print $$2}')
        case "$$pk" in hk_*) ;; *) echo "FATAL: empty/invalid producer key" >&2; exit 1;; esac
        printf '%s' "$$pk" > /run/secrets/producer_key
        chmod 0644 /run/secrets/producer_key
        : > /run/secrets/role_tokens
        for r in viewer operator admin; do
          tok=$$(hookrail-ctl create-admin-token -role "$$r" | awk -F= '/^admin_token=/{print $$2}')
          case "$$tok" in hkadm_*) ;; *) echo "FATAL: empty/invalid $$r token" >&2; exit 1;; esac
          echo "$$r:$$tok" >> /run/secrets/role_tokens
        done
        chmod 0644 /run/secrets/role_tokens
        h=$$(hookrail-dash-hash -hash-only -password dev-dashboard-pw)
        [ -n "$$h" ] || { echo "FATAL: empty users hash" >&2; exit 1; }
        printf 'admin:%s:admin\n' "$$h" > /run/secrets/dashboard_users
        chmod 0644 /run/secrets/dashboard_users
    environment: *hookrail-env
    volumes: [dashboard-secret:/run/secrets]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  api:
    build: ../..
    command: ["hookrail-api"]
    environment: *hookrail-env
    ports: ["8080:8080"]
    # NO redis dependency: the 202 durability path needs only PG (§3.1);
    # the sweeper repairs dispatch when Redis shows up late
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: ../..
    command: ["hookrail-worker"]
    environment: *hookrail-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  scheduler:
    build: ../..
    command: ["hookrail-scheduler"]
    environment: *hookrail-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  admin:
    build: ../..
    command: ["hookrail-admin"]
    environment:
      <<: *hookrail-env
      HOOKRAIL_ADMIN_TOKEN: "dev-admin-token-001"   # dev only; real deploys inject a secret (Slice E)
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  test-receiver:
    build: ../..
    command: ["test-receiver"]
    ports: ["9090:9090"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./grafana/provisioning/dashboards/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports: ["16686:16686"]

  dashboard:
    build:
      context: ../..
      target: dashboard
    command: ["hookrail-dashboard"]
    environment:
      HOOKRAIL_ADMIN_URL: http://admin:8082
      HOOKRAIL_INGRESS_URL: http://api:8080
      HOOKRAIL_DASHBOARD_SESSION_KEY: dev-session-key-0123456789abcdef0123
      HOOKRAIL_PRODUCER_KEY_FILE: /run/secrets/producer_key
      HOOKRAIL_DASHBOARD_USERS_FILE: /run/secrets/dashboard_users
      HOOKRAIL_DASHBOARD_ROLE_TOKENS_FILE: /run/secrets/role_tokens
      HOOKRAIL_DASHBOARD_INSECURE_COOKIE: "true"
    volumes: [dashboard-secret:/run/secrets:ro]
    ports: ["8085:8085"]
    depends_on:
      admin: { condition: service_started }
      api: { condition: service_started }
      dashboard-provisioner: { condition: service_completed_successfully }

volumes:
  dashboard-secret:
