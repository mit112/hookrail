# Hookrail quickstart — a self-contained, self-seeding demo stack that runs
# entirely from the published GHCR images (no Go toolchain, no build).
#
#   curl -O https://raw.githubusercontent.com/mit112/hookrail/main/deploy/compose/quickstart.yml
#   export HOOKRAIL_MASTER_KEY=$(openssl rand -hex 32)
#   docker compose -f quickstart.yml up -d
#   # open http://localhost:8085 (auto-logged in as a read-only viewer)
#
# A built-in seeder continuously produces traffic across a healthy, a flaky, and a
# dead endpoint, so the dashboard immediately shows delivered, retried, and
# dead-lettered webhooks. Tear down with `docker compose -f quickstart.yml down -v`.
#
# This is intentionally minimal: the core delivery path + dashboard only, no
# observability tier and no bind-mounted config, so it needs nothing but this one
# file. For the full stack (Grafana/Jaeger/Prometheus) use docker-compose.yml.
#
# Image tag defaults to `main` (the always-current CI build). To pin a stable
# release instead:
#   HOOKRAIL_IMAGE_TAG=v0.1.1 docker compose -f quickstart.yml up -d
name: hookrail-quickstart

x-hookrail-image: &hookrail-image ghcr.io/mit112/hookrail:${HOOKRAIL_IMAGE_TAG:-main}

# Fixed subnet so HOOKRAIL_ALLOW_CIDRS can name it: in-network delivery to the
# bundled receiver resolves to this range, which the default SSRF policy would
# otherwise (correctly) block as private.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16

x-hookrail-env: &hookrail-env
  DATABASE_URL: postgres://hookrail:hookrail@postgres:5432/hookrail?sslmode=disable
  REDIS_ADDR: redis:6379
  HOOKRAIL_MASTER_KEY: ${HOOKRAIL_MASTER_KEY}
  HOOKRAIL_ALLOW_HTTP: "true"            # quickstart-only: the receiver is plain http
  HOOKRAIL_ALLOW_CIDRS: "172.29.0.0/16"  # quickstart-only: allow in-network delivery

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookrail
      POSTGRES_USER: hookrail
      POSTGRES_PASSWORD: hookrail
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrail"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  migrate: # one-shot: every service waits for it, none race it
    image: *hookrail-image
    command: ["hookrail-ctl", "migrate"]
    restart: "no"
    environment: *hookrail-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: *hookrail-image
    command: ["hookrail-api"]
    environment: *hookrail-env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    image: *hookrail-image
    command: ["hookrail-worker"]
    environment: *hookrail-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  scheduler:
    image: *hookrail-image
    command: ["hookrail-scheduler"]
    environment: *hookrail-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  admin:
    image: *hookrail-image
    command: ["hookrail-admin"]
    environment:
      <<: *hookrail-env
      HOOKRAIL_ADMIN_TOKEN: "quickstart-admin-token"  # local demo only; never exposed on a host port
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  test-receiver:
    image: *hookrail-image
    command: ["test-receiver"]
    ports: ["9090:9090"]
    # Friendly hostnames for the dashboard: the seeded subscriptions deliver to
    # these aliases; all resolve to this one receiver, which routes by path.
    networks:
      default:
        aliases: [orders-service, payments-service, analytics-service]

  dashboard-provisioner:
    image: *hookrail-image
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        pk=$$(hookrail-ctl create-producer-key -name dashboard -scope '*' | awk -F= '/^producer_key=/{print $$2}')
        case "$$pk" in hk_*) ;; *) echo "FATAL: empty/invalid producer key" >&2; exit 1;; esac
        printf '%s' "$$pk" > /run/secrets/producer_key
        chmod 0644 /run/secrets/producer_key
        : > /run/secrets/role_tokens
        for r in viewer operator admin; do
          tok=$$(hookrail-ctl create-admin-token -role "$$r" | awk -F= '/^admin_token=/{print $$2}')
          case "$$tok" in hkadm_*) ;; *) echo "FATAL: empty/invalid $$r token" >&2; exit 1;; esac
          echo "$$r:$$tok" >> /run/secrets/role_tokens
        done
        chmod 0644 /run/secrets/role_tokens
        # Quickstart: a single viewer account with a random password, reached via
        # the passwordless DEMO_MODE auto-login. To administer/create endpoints,
        # run the full stack (`make up`), which provisions an admin login.
        rndpw=$$(head -c 24 /dev/urandom | base64)
        h=$$(hookrail-dash-hash -hash-only -password "$$rndpw")
        [ -n "$$h" ] || { echo "FATAL: empty users hash" >&2; exit 1; }
        printf 'demo:%s:viewer\n' "$$h" > /run/secrets/dashboard_users
        chmod 0644 /run/secrets/dashboard_users
    environment: *hookrail-env
    volumes: [dashboard-secret:/run/secrets]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  dashboard:
    image: ghcr.io/mit112/hookrail-dashboard:${HOOKRAIL_IMAGE_TAG:-main}
    command: ["hookrail-dashboard"]
    environment:
      HOOKRAIL_ADMIN_URL: http://admin:8082
      HOOKRAIL_INGRESS_URL: http://api:8080
      HOOKRAIL_DASHBOARD_SESSION_KEY: quickstart-session-key-0123456789abcd  # local demo only
      HOOKRAIL_DASHBOARD_PRODUCER_KEY_FILE: /run/secrets/producer_key
      HOOKRAIL_PRODUCER_KEY_FILE: /run/secrets/producer_key
      HOOKRAIL_DASHBOARD_USERS_FILE: /run/secrets/dashboard_users
      HOOKRAIL_DASHBOARD_ROLE_TOKENS_FILE: /run/secrets/role_tokens
      HOOKRAIL_DASHBOARD_INSECURE_COOKIE: "true"   # local http
      HOOKRAIL_DASHBOARD_DEMO_MODE: "true"
      HOOKRAIL_DASHBOARD_DEMO_USER: "demo"
    ports: ["8085:8085"]
    depends_on:
      admin: { condition: service_started }
      api: { condition: service_started }
      dashboard-provisioner: { condition: service_completed_successfully }

  demo-seeder:
    image: *hookrail-image
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # Three subscriptions covering the interesting outcomes:
        #   succeed -> delivered   flap -> retried-then-delivered   fail -> dead-lettered
        out=$$(hookrail-ctl seed -url http://orders-service:9090/succeed -topic 'demo.orders.*')
        pk=$$(printf '%s' "$$out" | awk -F= '/^producer_key=/{print $$2}')
        case "$$pk" in hk_*) ;; *) echo "FATAL: seed produced no producer key" >&2; exit 1;; esac
        hookrail-ctl seed -url http://payments-service:9090/flap       -topic 'demo.flaky.*' >/dev/null || true
        hookrail-ctl seed -url http://analytics-service:9090/fail/9999 -topic 'demo.retry.*' >/dev/null || true
        echo "demo-seeder: seeded; producing events…"
        n=0
        while true; do
          n=$$((n + 1))
          for t in demo.orders.created demo.flaky.ping demo.retry.sync; do
            wget -q -O /dev/null \
              --header="Authorization: Bearer $$pk" \
              --header="Content-Type: application/json" \
              --post-data="{\"topic\":\"$$t\",\"payload\":{\"seq\":$$n,\"at\":\"demo\"}}" \
              http://api:8080/v1/events || true
          done
          sleep 4
        done
    environment: *hookrail-env
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      api: { condition: service_started }
      test-receiver: { condition: service_started }

volumes:
  dashboard-secret:
