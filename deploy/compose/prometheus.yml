global:
  scrape_interval: 5s
scrape_configs:
  - job_name: hookrail-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: hookrail-worker
    # DNS A-record discovery so EVERY worker replica is scraped under
    # `--scale worker=N` (a single static `worker:8081` target only ever
    # resolves to one replica, which would hide failopen/denied decisions on
    # the others and make the global-cap oracle vacuous).
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8081
        refresh_interval: 2s
  - job_name: hookrail-scheduler
    static_configs:
      - targets: ["scheduler:8083"]
