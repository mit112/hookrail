apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: hookrail
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-to-admin
  namespace: hookrail
spec:
  podSelector:
    matchLabels:
      app: admin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dashboard
      ports:
        - port: 8082
---
# CNPG ingress (design spec §5, Codex MAJOR #5). The Cluster pods carry the
# label cnpg.io/cluster: hookrail-pg and live in the default-deny-ingress ns, so
# they need explicit edges for: operator->instance (5432 conn + 8000 instance
# manager), instance<->instance (streaming replication on 5432), and app/job->-rw.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-postgres-cnpg
  namespace: hookrail
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: hookrail-pg
  policyTypes:
    - Ingress
  ingress:
    # operator pods ONLY (cnpg-system namespace AND the cloudnative-pg pod label —
    # combined in one peer = AND): 5432 (management) + 8000 (instance manager).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 5432
        - port: 8000
    # peer CNPG instances: streaming replication on 5432 only (no 8000 peer-to-peer)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: hookrail-pg
      ports:
        - port: 5432
    # application + migrate/bootstrap pods: SQL only
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: worker
        - podSelector:
            matchLabels:
              app: scheduler
        - podSelector:
            matchLabels:
              app: admin
        - podSelector:
            matchLabels:
              app: dashboard
        - podSelector:
            matchLabels:
              app: migrate
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-redis
  namespace: hookrail
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: worker
        - podSelector:
            matchLabels:
              app: scheduler
        - podSelector:
            matchLabels:
              app: admin
        - podSelector:
            matchLabels:
              app: dashboard
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-otel
  namespace: hookrail
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: worker
        - podSelector:
            matchLabels:
              app: scheduler
        - podSelector:
            matchLabels:
              app: admin
        - podSelector:
            matchLabels:
              app: dashboard
      ports:
        - port: 4318
---
# otel-collector exports traces to jaeger:4317 (OTLP gRPC) — without this the
# collector cannot flush spans and errors/crashloops behind the default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-to-jaeger
  namespace: hookrail
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317
---
# prometheus scrapes app /metrics — default-deny otherwise blocks every scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-api
  namespace: hookrail
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-worker
  namespace: hookrail
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-scheduler
  namespace: hookrail
spec:
  podSelector:
    matchLabels:
      app: scheduler
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8083
