---
# Redis HA topology (design spec §3.2): a master + replica StatefulSet with
# per-pod stable DNS via a headless Service. Sentinel (redis-sentinel.yaml) drives
# promotion. Clients reach the CURRENT master through go-redis FailoverClient, NOT a
# fixed ClusterIP — so the prior `redis` ClusterIP Service is intentionally removed.
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: hookrail
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  # publishNotReadyAddresses so peer discovery + Sentinel monitoring resolve pod DNS
  # during the bootstrap/promotion windows before a pod flips Ready.
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: hookrail
spec:
  serviceName: redis-headless
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "/scripts/start.sh"]
          env:
            # Pin HOSTNAME to the pod name so the entrypoint derives stable per-pod DNS
            # (the container hostname already equals the pod name for a StatefulSet, but
            # set it explicitly to avoid depending on runtime behavior).
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: entrypoint
              mountPath: /scripts
      volumes:
        - name: entrypoint
          configMap:
            name: redis-entrypoint
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
