---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hookrail
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: hookrail-api
        static_configs:
          - targets: ["api:8080"]
      - job_name: hookrail-worker
        static_configs:
          - targets: ["worker:8081"]
      - job_name: hookrail-scheduler
        static_configs:
          - targets: ["scheduler:8083"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: hookrail
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: hookrail
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
