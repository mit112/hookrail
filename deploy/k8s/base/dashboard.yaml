---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: hookrail
  labels:
    app: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
      annotations:
        # Secret changes (users / role tokens) require a rolling restart or an
        # in-pod SIGHUP to take effect (RBAC R2, D3). In a templated deploy set
        # this to a checksum of the secrets to auto-roll; for raw manifests use
        # `kubectl rollout restart deploy/dashboard` (see docs/dashboard.md).
        hookrail.dev/secrets-reload: "rollout-or-sighup"
    spec:
      serviceAccountName: wait-for-migrate
      initContainers:
        - name: wait-migrate
          image: rancher/kubectl:v1.33.1
          command: ["kubectl", "wait", "--for=condition=complete", "--timeout=120s", "job/migrate"]
      containers:
        - name: dashboard
          image: hookrail-dashboard
          command: ["hookrail-dashboard"]
          ports:
            - containerPort: 8085
          env:
            - name: HOOKRAIL_ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: hookrail-config
                  key: HOOKRAIL_ADMIN_URL
            - name: HOOKRAIL_INGRESS_URL
              valueFrom:
                configMapKeyRef:
                  name: hookrail-config
                  key: HOOKRAIL_INGRESS_URL
            - name: HOOKRAIL_DASHBOARD_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: hookrail-dashboard
                  key: session_key
            - name: HOOKRAIL_PRODUCER_KEY_FILE
              value: "/etc/producer-key/producer_key"
            - name: HOOKRAIL_DASHBOARD_USERS_FILE
              value: "/etc/dashboard-users/dashboard_users"
            - name: HOOKRAIL_DASHBOARD_ROLE_TOKENS_FILE
              value: "/etc/dashboard-role-tokens/role_tokens"
            - name: HOOKRAIL_DASHBOARD_ATTEST_INTERVAL
              value: "5s"
          volumeMounts:
            - name: producer-key
              mountPath: /etc/producer-key
              readOnly: true
            - name: dashboard-users
              mountPath: /etc/dashboard-users
              readOnly: true
            - name: dashboard-role-tokens
              mountPath: /etc/dashboard-role-tokens
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8085
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: producer-key
          secret:
            secretName: hookrail-dashboard-producer-key
        - name: dashboard-users
          secret:
            secretName: hookrail-dashboard-users
        - name: dashboard-role-tokens
          secret:
            secretName: hookrail-dashboard-role-tokens
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dashboard
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: hookrail
  labels:
    app: dashboard
spec:
  selector:
    app: dashboard
  ports:
    - port: 8085
      targetPort: 8085
