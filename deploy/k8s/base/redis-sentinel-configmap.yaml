---
# Seed sentinel.conf (design spec §3.2). Copied ONCE into each Sentinel's PVC by an
# initContainer; thereafter Sentinel OWNS the file and rewrites failover/epoch state
# in place (BLOCKER-2 — an ephemeral conf makes a restarted Sentinel forget the
# current master and risk re-promoting a stale redis-0). resolve-hostnames +
# announce-hostnames keep discovery stable across pod-IP churn (Redis 7).
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: hookrail
data:
  sentinel.conf: |
    port 26379
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor hookrail redis-0.redis-headless.hookrail.svc.cluster.local 6379 2
    # Detection tuned so Sentinel reliably promotes the surviving replica before a
    # force-deleted master pod can reschedule and re-seize mastership (RTO ~3-9s).
    sentinel down-after-milliseconds hookrail 3000
    sentinel failover-timeout hookrail 6000
    sentinel parallel-syncs hookrail 1
