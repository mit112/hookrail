---
# Sentinel-aware role-selection entrypoint for the redis StatefulSet (design spec
# §3.2, BLOCKER-2). The brittle "no master => redis-0" rule is avoided: a restarted
# pod always rejoins the CURRENT master and never re-seizes mastership after a real
# failover. Order: (1) ask the Sentinel quorum; (2) else probe peers' ROLE directly;
# (3) genesis (ordinal 0 only) when no master is known anywhere.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-entrypoint
  namespace: hookrail
data:
  start.sh: |
    #!/bin/sh
    set -eu
    SENTINELS="redis-sentinel-0.redis-sentinel redis-sentinel-1.redis-sentinel redis-sentinel-2.redis-sentinel"
    POD_FQDN="${HOSTNAME}.redis-headless.hookrail.svc.cluster.local"
    MASTER=""
    # 1. Ask the Sentinel quorum for the current master (authoritative post-failover).
    for s in $SENTINELS; do
      A=$(redis-cli -h "$s" -p 26379 sentinel get-master-addr-by-name hookrail 2>/dev/null | head -n1 || true)
      case "$A" in
        ""|"(nil)"|ERR*|NOGOODSLAVE*|NOMASTER*) : ;;
        *) MASTER="$A"; break ;;
      esac
    done
    # 2. Else probe each peer's ROLE directly (covers a Sentinel cold start where the
    #    quorum has not yet discovered the master). A fresh redis-server is master
    #    until told otherwise, so the genesis seed self-reports master immediately.
    if [ -z "$MASTER" ]; then
      for p in redis-0 redis-1; do
        [ "$p" = "$HOSTNAME" ] && continue
        R=$(redis-cli -h "$p.redis-headless" -p 6379 role 2>/dev/null | head -n1 || true)
        if [ "$R" = "master" ]; then
          MASTER="$p.redis-headless.hookrail.svc.cluster.local"
          break
        fi
      done
    fi
    {
      echo "appendonly yes"
      echo "replica-announce-ip ${POD_FQDN}"
      # Shrink the async-replication loss window (BLOCKER-1): a master refuses writes
      # unless >=1 replica is within 10s of lag. Does NOT make Redis the RPO source of
      # truth (PG+sweeper is) — it bounds, not eliminates, the un-replicated window.
      echo "min-replicas-to-write 1"
      echo "min-replicas-max-lag 10"
      if [ -n "$MASTER" ] && [ "$MASTER" != "$POD_FQDN" ]; then
        # A live master exists and it is not me -> follow it (post-failover rejoin too).
        echo "replicaof ${MASTER} 6379"
      elif [ -z "$MASTER" ] && [ "${HOSTNAME##*-}" != "0" ]; then
        # No master known anywhere AND I am not ordinal 0 -> follow the genesis seed.
        echo "replicaof redis-0.redis-headless.hookrail.svc.cluster.local 6379"
      fi
      # else: (MASTER resolves to me) OR (no master & I am redis-0) -> start as master.
    } > /tmp/redis.conf
    exec redis-server /tmp/redis.conf
