---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: hookrail
  labels:
    app: scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      serviceAccountName: wait-for-migrate
      initContainers:
        - name: wait-migrate
          image: rancher/kubectl:v1.33.1
          command: ["kubectl", "wait", "--for=condition=complete", "--timeout=120s", "job/migrate"]
        - name: wait-redis
          image: busybox:1.36
          # Sentinel mode: gate on a reachable Sentinel (the app's FailoverClient then
          # discovers the master). The old fixed `redis` ClusterIP no longer exists.
          command: ["sh", "-c", "until nc -z redis-sentinel 26379; do sleep 1; done"]
      containers:
        - name: scheduler
          image: hookrail
          command: ["hookrail-scheduler"]
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: hookrail-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hookrail-db
                  key: app_dsn
            - name: HOOKRAIL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: hookrail-app
                  key: master_key
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: scheduler
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: hookrail
  labels:
    app: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - port: 8083
      targetPort: 8083
