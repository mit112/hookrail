---
apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-keygen
  namespace: hookrail
  labels:
    app: dashboard-keygen
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: dashboard-keygen
    spec:
      restartPolicy: Never
      serviceAccountName: wait-for-migrate
      initContainers:
        - name: wait-migrate
          image: rancher/kubectl:v1.33.1
          command: ["kubectl", "wait", "--for=condition=complete", "--timeout=120s", "job/migrate"]
      containers:
        - name: keygen
          image: hookrail
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              hookrail-ctl create-producer-key -name dashboard
              for r in viewer operator admin; do
                printf 'role_token_%s=' "$r"
                hookrail-ctl create-admin-token -role "$r" | awk -F= '/^admin_token=/{print $2}'
              done
              printf 'users_hash='
              hookrail-dash-hash -hash-only -password dev-dashboard-pw
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hookrail-db
                  key: migrator_dsn
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: hookrail-config
                  key: REDIS_ADDR
            - name: HOOKRAIL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: hookrail-app
                  key: master_key
