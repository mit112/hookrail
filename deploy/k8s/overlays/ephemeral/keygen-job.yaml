---
apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-keygen
  namespace: hookrail
  labels:
    app: dashboard-keygen
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: dashboard-keygen
    spec:
      restartPolicy: Never
      serviceAccountName: wait-for-migrate
      initContainers:
        - name: wait-migrate
          image: rancher/kubectl:v1.33.1
          command: ["kubectl", "wait", "--for=condition=complete", "--timeout=120s", "job/migrate"]
      containers:
        - name: keygen
          image: hookrail
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pk=$(hookrail-ctl create-producer-key -name dashboard | awk -F= '/^producer_key=/{print $2}')
              case "$pk" in hk_*) ;; *) echo "FATAL: empty/invalid producer key" >&2; exit 1;; esac
              printf 'producer_key=%s\n' "$pk"
              for r in viewer operator admin; do
                tok=$(hookrail-ctl create-admin-token -role "$r" | awk -F= '/^admin_token=/{print $2}')
                case "$tok" in hkadm_*) ;; *) echo "FATAL: empty/invalid $r token" >&2; exit 1;; esac
                printf 'role_token_%s=%s\n' "$r" "$tok"
              done
              h=$(hookrail-dash-hash -hash-only -password dev-dashboard-pw)
              [ -n "$h" ] || { echo "FATAL: empty users hash" >&2; exit 1; }
              printf 'users_hash=%s\n' "$h"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hookrail-db
                  key: migrator_dsn
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: hookrail-config
                  key: REDIS_ADDR
            - name: HOOKRAIL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: hookrail-app
                  key: master_key
