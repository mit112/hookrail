apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - dev-secret.yaml
  - test-receiver.yaml
  - test-receiver-netpol.yaml
  - ephemeral-jobs-netpol.yaml
  - keygen-job.yaml
  - db-bootstrap.yaml
images:
  - name: hookrail
    newName: hookrail
    newTag: e2e
  - name: hookrail-dashboard
    newName: hookrail-dashboard
    newTag: e2e
patches:
  # containers/0/imagePullPolicy applies to every Deployment (incl. test-receiver)
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # initContainers/0 — api, admin, dashboard each have exactly 1 initContainer
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: admin
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: dashboard
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
  # dashboard: add second initContainer that waits for producer-key Secret to be populated
  - target:
      kind: Deployment
      name: dashboard
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/1
        value:
          name: wait-producer-key
          image: busybox:1.36
          imagePullPolicy: Never
          command: ["sh", "-c", "until [ -s /etc/producer-key/producer_key ]; do sleep 2; done"]
          volumeMounts:
            - name: producer-key
              mountPath: /etc/producer-key
              readOnly: true
  # worker has 2 initContainers (wait-migrate + wait-redis)
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
      - op: add
        path: /spec/template/spec/initContainers/1/imagePullPolicy
        value: Never
  # scheduler has 2 initContainers (wait-migrate + wait-redis)
  - target:
      kind: Deployment
      name: scheduler
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
      - op: add
        path: /spec/template/spec/initContainers/1/imagePullPolicy
        value: Never

  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Dev-only: allow http:// URLs (SSRF policy) so admin can create endpoints
  # pointing at the in-cluster test-receiver and worker can deliver to it.
  # Dev-only: allow http:// URLs (SSRF policy) so admin can create endpoints
  # pointing at the in-cluster test-receiver and worker can deliver to it.
  # Also allow k3d's service CIDR (10.43.0.0/16) to accept ClusterIPs.
  - target:
      kind: ConfigMap
      name: hookrail-config
    patch: |-
      - op: add
        path: /data/HOOKRAIL_ALLOW_HTTP
        value: "true"
      - op: add
        path: /data/HOOKRAIL_ALLOW_CIDRS
        value: "10.43.0.0/16"
