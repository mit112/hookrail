# cloudflared tunnel — connects to Cloudflare, routes ingest + dashboard hostnames.
# The cloudflared-token Secret is created ATTENDED (not stored here).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: hookrail
data:
  config.yaml: |
    ingress:
      - hostname: INGEST_HOSTNAME_PLACEHOLDER
        service: http://api:8080
      - hostname: DASHBOARD_HOSTNAME_PLACEHOLDER
        service: http://dashboard:8085
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: hookrail
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.2.1
          command: ["cloudflared", "tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
